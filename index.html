<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Picky 메뉴보드</title>
<link rel="preload" href="fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: Pretendard; font-weight: 45 920; font-style: normal; font-display: swap;
    src: url(fonts/PretendardVariable.woff2) format('woff2-variations'), url(fonts/PretendardVariable.woff2) format('woff2'); }
  /* Board colours: the page around the board follows the theme; the board itself is print-fixed. */
  :root { --bg: #f8f5ee; --fg: #531d0e; --dim: #9a8a7a; --ink: #531d0e; --cream: #fcfaf5; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #171310; --fg: #f3e9dc; --dim: #7a6b5d; color-scheme: dark } }
  :root[data-theme="dark"] { --bg: #171310; --fg: #f3e9dc; --dim: #7a6b5d; color-scheme: dark }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0; box-sizing: border-box; }
  body.full { padding: 0; }
  .stage { width: 100%; height: 100%; display: grid; place-items: center; }
  /* --fw / --fh = frame size in px (set from JS), so every overlay scales with the board. */
  .frame { --fw: 1920px; --fh: 1080px; position: relative; aspect-ratio: 16 / 9; width: min(100%, calc(100svh * 16 / 9)); max-height: 100%;
    overflow: hidden; background: #fff; }
  /* Two panels: photo (2311/3840) and menu (the rest). */
  #left { position: absolute; left: 0; top: 0; height: 100%; width: calc(100% * 2311 / 3840); }
  #right { position: absolute; top: 0; right: 0; height: 100%; left: calc(100% * 2311 / 3840); z-index: 2; }
  #photo { position: absolute; left: 0; top: 0; height: 100%; width: calc(100% + 1px); display: block; }  /* 1px under the menu: no seam */
  #menu { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #steam { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  /* Photo slideshow over the photo panel. */
  .slides { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .frame .slide { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0;
    transition: opacity 1.6s ease; will-change: opacity, transform; transform-origin: center; }
  .frame .slide.on { opacity: 1; animation: kb 14s linear forwards; }
  .frame video.slide.on { animation: none; }
  @keyframes kb { from { transform: scale(1.0) } to { transform: scale(1.06) } }
  /* Price caption (home slide only), same type as the menu item rows. */
  .price { position: absolute; left: calc(var(--fw) * 460 / 3840); top: calc(var(--fh) * 95 / 2160);
    width: calc(var(--fw) * (1150 - 460) / 3840); margin: 0; padding: 0; list-style: none;
    font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    font-size: calc(var(--fh) * 58 / 2160); line-height: 1.5; color: #531d0e; letter-spacing: -0.005em;
    font-synthesis: none; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; pointer-events: none; }
  .price li { display: flex; justify-content: space-between; align-items: baseline; white-space: nowrap; }
  .price .n { font-weight: 500; }
  .price .p { font-weight: 400; font-variant-numeric: tabular-nums; }
  #steam, .price { transition: opacity 1.2s ease; }
  body.away #steam, body.away .price { opacity: 0; }
  /* Menu overlays: logo (drawn), PICKY letters, crumbs, MENU letters. Boxes are fractions of the menu panel. */
  #logoBox { position: absolute; pointer-events: none; }
  #logoBox canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ov { position: absolute; display: block; pointer-events: none; user-select: none; }
  .caret { position: absolute; background: #531d0e; opacity: 0; pointer-events: none; }
  #right.intro .pl { animation: pop .38s cubic-bezier(.3,1.5,.5,1) both; }
  /* Salt flecks sprinkled from above: start --dx/--dy away (set per fleck from JS), fall with an ease-in, overshoot 1 frame, settle. */
  #right.intro .crumb { animation: sprinkle .45s both; }
  @keyframes sprinkle {
    0% { opacity: 0; transform: translate(var(--dx), var(--dy)); animation-timing-function: cubic-bezier(.45, 0, 1, 1); }
    33% { opacity: 1; }
    96% { transform: translate(0, var(--os)); animation-timing-function: linear; }
    100% { opacity: 1; transform: translate(0, 0); } }
  /* "Pick!" stickers next to recommended items; left/top are fractions of the menu panel, sizes follow the board height. */
  .pick { position: absolute; margin: 0; pointer-events: none; white-space: nowrap; box-sizing: border-box;
    height: calc(var(--fh) * 82 / 4320); line-height: calc(var(--fh) * 82 / 4320); padding: 0 0.65em; border-radius: 999px;
    background: #531d0e; color: #fcfaf5; font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", system-ui, sans-serif;
    font-weight: 800; font-size: calc(var(--fh) * 57 / 4320); letter-spacing: 0.01em; font-synthesis: none;
    -webkit-font-smoothing: antialiased; transform-origin: 50% 50%; transform: translateY(-50%) rotate(-6deg);
    animation: wiggle 2.6s ease-in-out infinite; }
  @keyframes wiggle {                      /* continuous gentle rocking around the -6deg resting tilt */
    0%, 100% { transform: translateY(-50%) rotate(-10deg); }
    50% { transform: translateY(-50%) rotate(-2deg); } }
  /* Salt-bread box: only the brown fill rocks; its text sprite sits still on top. */
  .bbox-fill { transform-origin: 50% 50%; animation: boxsway 3.2s ease-in-out infinite; will-change: transform; }
  @keyframes boxsway { 0%, 100% { transform: rotate(-1deg) translateX(-0.2%) } 50% { transform: rotate(1deg) translateX(0.2%) } }
  #right.intro .ml { animation: fade .09s linear both; }
  #right.intro .caret { animation: blink .4s step-end 3; }
  @keyframes pop { from { opacity: 0; transform: scale(.6) } 40% { opacity: 1 } to { opacity: 1; transform: scale(1) } }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes blink { 0% { opacity: 1 } 50% { opacity: 0 } }
  /* Bottom ticker across both panels. */
  .ticker { position: absolute; left: 0; right: 0; bottom: 0; height: 4.6%; z-index: 5; overflow: hidden;
    background: var(--cream); border-top: max(1px, calc(var(--fh) * 2 / 1080)) solid #531d0e; box-sizing: border-box;
    display: flex; align-items: center; pointer-events: none; }
  .track { display: flex; align-items: center; width: max-content; will-change: transform;
    animation: tick var(--dur, 40s) linear infinite; }
  .track img { display: block; flex: none; }
  .track .w { height: calc(var(--fh) * 0.046 * 0.55); margin-right: calc(var(--fh) * 0.034); }
  .track .s { height: calc(var(--fh) * 0.046 * 0.85); margin-right: calc(var(--fh) * 0.034); }   /* same gap on both sides as the word gap */
  @keyframes tick { from { transform: translateX(0) } to { transform: translateX(-50%) } }
  .hint { position: fixed; left: 50%; bottom: calc(14px + min(4.6svh, 2.6vw) + env(safe-area-inset-bottom, 0px));   /* above the ticker */ transform: translateX(-50%); z-index: 10;
    font: 500 13px/1.4 Pretendard, -apple-system, system-ui, sans-serif; letter-spacing: .04em;
    color: var(--dim); background: color-mix(in srgb, var(--bg) 85%, transparent);
    padding: 6px 12px; border-radius: 999px; transition: opacity .6s; white-space: nowrap; }
  .hint.hidden { opacity: 0; pointer-events: none; }
  body.idle { cursor: none; }
  @media (prefers-reduced-motion: reduce) {
    .hint { transition: none } .frame .slide { transition-duration: 0s } .frame .slide.on { animation: none }
    #steam, .price { transition: none } .track { animation: none }
    #right.intro .pl, #right.intro .crumb, #right.intro .ml, #right.intro .caret, .pick, .bbox-fill { animation: none } }
</style>

    setSize();
    window.addEventListener('resize', setSize);
    if (window.ResizeObserver) new ResizeObserver(setSize).observe(frame);
  })();
  (function () {
    var body = document.body, hint = document.getElementById('hint');
    var idleTimer;
    function wake() {
      body.classList.remove('idle'); hint.classList.remove('hidden');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(function () { body.classList.add('idle'); hint.classList.add('hidden'); }, 4000);

      p.peak = rnd(0.36, 0.5);            // per puff; overlaps reach ~0.2-0.28
      return p;
    }
    // Start mid-cycle (some already rising, some waiting) so there is no visible 'first puff'.
    for (var i = 0; i < N; i++) { var q = spawn({}, 0); q.age = rnd(-2, q.life * 0.8); parts.push(q); }
    function blob(x, y, r, a, sy) {
      // Soft, vertically stretched puff; softness comes from the gradient, not ctx.filter.
      ctx.save(); ctx.translate(x, y); ctx.scale(1, sy || 1);
      var g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
      g.addColorStop(0, 'rgba(255,250,240,' + a + ')');
      g.addColorStop(0.35, 'rgba(255,250,240,' + (a * 0.62) + ')');
      g.addColorStop(0.7, 'rgba(255,250,240,' + (a * 0.18) + ')');
      g.addColorStop(1, 'rgba(255,250,240,0)');
      ctx.fillStyle = g; ctx.fillRect(-r, -r, r * 2, r * 2);
      ctx.restore();
    }
    function draw(dt) {
      ctx.clearRect(0, 0, W, H);
      ctx.save();
      ctx.beginPath(); ctx.rect(0, 0, W * 0.6, H); ctx.clip();   // never over the menu side
      ctx.globalCompositeOperation = 'lighter';
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i]; p.age += dt;
        if (p.age >= p.life) { spawn(p, rnd(0, 1.5)); continue; }
        if (p.age < 0) continue;
        // Each wisp is a chain of small blobs along its own rising, swaying path (newest at the head).
        var SEG = 9, STEP = 0.16;
        for (var k = 0; k < SEG; k++) {
          var age = p.age - k * STEP; if (age < 0) break;
          var t = age / p.life;
          var fy = p.y0 - p.vy * age;
          var fx = p.x0 + p.drift * age + Math.sin(p.ph + age * p.freq * Math.PI * 2) * p.amp * (0.4 + t);
          var a = p.peak * (t < 0.2 ? t / 0.2 : Math.pow(1 - (t - 0.2) / 0.8, 1.5));
          a *= 0.55 * (1 - k / SEG) + 0.12;                  // tail thins out behind the head
          // Fade out early near the price text (top-left) and the top edge.
          if (fy < 0.15 && fx < 0.32) a *= Math.max(0, (fy - 0.07) / 0.08);
          if (fy < 0.08) a *= Math.max(0, (fy - 0.02) / 0.06);
          a *= Math.max(0, Math.min(1, (fy - (p.y0 - 0.13)) / 0.05));   // dissolve within ~13% of frame height above the crust
          var rad = p.r0 * (0.7 + (p.grow - 1) * t) * H * (1 - 0.35 * k / SEG);
          var room = (0.6 * W - fx * W) / rad;              // fade before the menu-side clip so no hard edge shows
          if (room < 1) a *= Math.max(0, room) * Math.max(0, room);
          if (a <= 0.004) continue;
          blob(fx * W, fy * H, rad, a, 1.15);
        }
      }
      ctx.restore();
    }
    function drawStatic() {
      ctx.clearRect(0, 0, W, H); ctx.save(); ctx.globalCompositeOperation = 'screen';
      blob(0.43 * W, 0.13 * H, 0.06 * H, 0.08, 1.6); blob(0.45 * W, 0.09 * H, 0.07 * H, 0.05, 1.4); ctx.restore();
    }
    function loop(ts) {
      var dt = last ? Math.min((ts - last) / 1000, 0.1) : 0; last = ts;
      draw(dt); raf = requestAnimationFrame(loop);
    }
    function start() { if (!raf && !reduce && !document.hidden) { last = 0; raf = requestAnimationFrame(loop); } }
    function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; }
    size();
    window.addEventListener('resize', size);
    if (window.ResizeObserver) new ResizeObserver(size).observe(frame);
    window.addEventListener('load', size);
    document.addEventListener('visibilitychange', function () { document.hidden ? stop() : start(); });
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
      var onMq = function () { reduce = mq.matches; if (reduce) { stop(); drawStatic(); } else start(); };
      mq.addEventListener ? mq.addEventListener('change', onMq) : mq.addListener && mq.addListener(onMq);
    }
    start();
  })();
</script>

</body>
